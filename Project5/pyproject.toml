[project]
name = "cs180-project5-nerf"
version = "0.1.0"
description = "CS180 Project 5: Neural Fields and Neural Radiance Fields"
requires-python = ">=3.10,<3.14"
dependencies = [
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pillow>=10.0",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nerf_project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
